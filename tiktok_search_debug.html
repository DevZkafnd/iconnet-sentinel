"vid_mod_analytics_appeal_detailpg_reason_title":"Alasan pelanggaran","vid_mod_analytics_detail_pg_title":"Video tidak memenuhi syarat","vid_mod_analytics_detail_pg_desc":"Video ini tidak memenuhi syarat untuk feed Saran karena melanggar Panduan Komunitas kami.","vidModAnalytics_detailPg_sectionSuccess_header":"Permohonan banding disetujui","vid_mod_analytics_appeal_success_detail_pg_desc":"Kami telah meninjau permohonan banding Anda dan telah memulihkan video Anda. Kami mohon maaf atas ketidaknyamanan yang mungkin telah timbul karena ini. Terima kasih telah menjadi bagian dari komunitas TikTok!","vid_mod_analytics_appeal_detail_pg_title":"Video dihapus","vid_mod_analytics_appeal_detail_pg_desc":"Video ini melanggar Panduan Komunitas kami.","vidModAnalytics_appealSubmitted_sectionTitle_header":"Permintaan diterima","vid_mod_analytics_appeal_rcv_detail_pg_desc":"Kami telah menerima permohonan banding Anda dan akan memberitahukan hasil banding setelah tersedia.","vid_mod_analytics_penalty_reason_minor_title":"Keselamatan anak di bawah umur","vid_mod_analytics_penalty_reason_minor_desc":"Untuk memberikan ruang tambahan bagi remaja yang ingin menunjukkan identitas dan mengekspresikan diri di ruang digital, konten yang diunggah oleh pengguna yang berusia di bawah 16 tahun tidak memenuhi syarat untuk direkomendasikan. Promosi bedah kosmetik untuk anak di bawah umur dapat membuat mereka semakin tidak puas dengan tubuh mereka. Oleh karena itu, konten tersebut – termasuk video sebelum dan sesudah, video prosedur pembedahan, dan pesan yang membahas bedah kosmetik elektif tanpa peringatan risiko – tidak memenuhi syarat untuk feed Saran semua pengguna yang berusia di bawah 18 tahun.","vid_mod_analytics_penalty_reason_unoriginal_title":"Konten kode QR, berkualitas rendah, dan tidak orisinal","vid_mod_analytics_penalty_reason_unoriginal_desc":"Dalam rangka membuat TikTok tetap positif dan menyenangkan bagi pengguna kami, konten yang tidak orisinal atau berkualitas rendah tidak memenuhi syarat untuk direkomendasikan. Konten tidak orisinal mencakup video yang baru saja diimpor atau diunggah dari sumber lain (seperti platform lain, acara TV, film, atau webcast) tanpa pengeditan baru yang kreatif. Kami dapat mengetahui bahwa suatu video tidak orisinal dari tanda air atau logo yang tumpang tindih. Konten berkualitas rendah mencakup video yang sangat singkat, gambar statis, dan video yang dibuat hanya dari GIF. Konten yang menyertakan ode QR biasanya tidak memenuhi syarat di feed Saran karena dapat mengarahkan pengguna ke situs web atau aplikasi berbahaya. Meskipun demikian, kami membuat pengecualian untuk konten yang risikonya rendah (misalnya, konten e-commerce).","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_title":"Konten kode QR, berkualitas rendah, dan tidak orisinal","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_desc":"Untuk terus memberikan pengalaman positif yang diharapkan pengguna kami dari platform TikTok, konten yang tidak orisinal dan berkualitas rendah tidak memenuhi syarat untuk direkomendasikan. Konten yang tidak orisinal adalah konten yang baru saja diimpor atau disalin dari sumber lain tanpa editan baru yang kreatif. Video mungkin tidak orisinal jika memiliki tanda air atau logo. Konten berkualitas rendah mencakup video yang sangat singkat, gambar statis, dan video yang dibuat hanya dari GIF.","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_title":"Akun reproduksi","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_desc":"Akun Anda berisi postingan yang tidak orisinal dan tidak memenuhi syarat untuk feed Saran. Untuk informasi selengkapnya, tinjau Panduan Komunitas kami \u003E Tidak Cocok untuk feed Saran \u003E Konten kode QR, berkualitas rendah, dan tidak orisinal","vid_mod_analytics_penalty_reason_spam_title":"Konten menyesatkan, tidak asli, atau spam","vid_mod_analytics_penalty_reason_spam_desc":"Konten yang dibuat untuk mengelabui atau memanipulasi pengguna agar mendapatkan lebih banyak pengikut, tanda suka, tayangan, atau metrik keterlibatan lainnya di platform tidak memenuhi syarat untuk feed Saran. Konten tersebut mencakup konten yang mendorong pengguna untuk saling mengikuti atau memberikan tanda suka, atau konten yang menipu pengguna agar mengeklik tombol suka atau bagikan. Selain itu, konten yang mempromosikan teori konspirasi dan menyebarkan informasi palsu atau berbahaya tentang peristiwa terkini dan peristiwa yang masih belum jelas kepastiannya juga tidak memenuhi syarat untuk feed Saran.","vid_mod_analytics_penalty_reason_sexual_title":"Konten seksual yang eksplisit","vid_mod_analytics_penalty_reason_sexual_desc":"Untuk terus memberikan pengalaman yang nyaman, konten yang menjurus ke seksual secara eksplisit mungkin tidak memenuhi syarat untuk direkomendasikan, termasuk konten yang menggambarkan ketelanjangan secara tersirat, menseksualisasikan bagian tubuh, atau konten erotis atau sensual secara terang-terangan (yaitu, tarian telanjang).","vid_mod_analytics_penalty_reason_tobacco_title":"Produk tembakau dan alkohol","vid_mod_analytics_penalty_reason_tobacco_desc":"Konten yang mempromosikan, menyebutkan, atau menggambarkan produk alkohol yang dikonsumsi oleh orang yang cukup umur untuk minum, tetapi dilakukan dengan cara yang berbahaya mungkin tidak memenuhi syarat untuk direkomendasikan. Konten yang menggambarkan penggunaan produk tembakau oleh orang dewasa atau menyebutkan zat-zat yang diawasi oleh pemerintah tidak memenuhi syarat untuk direkomendasikan.","vid_mod_analytics_penalty_reason_stunts_title":"Aksi dan olahraga berbahaya","vid_mod_analytics_penalty_reason_stunts_desc":"Jika ditiru tanpa tindakan pencegahan keselamatan, aktivitas tertentu dapat berisiko atau berbahaya, yang dapat menyebabkan cedera fisik. Konten yang berisi aksi berbahaya, atau olahraga ekstrem yang dilakukan oleh nonprofesional, mungkin tidak memenuhi syarat.","vid_mod_analytics_penalty_reason_graphic_title":"Konten kekerasan dan mengerikan","vid_mod_analytics_penalty_reason_graphic_desc":"Konten yang menyebabkan penonton merasa tidak nyaman, terkejut, atau jijik mungkin tidak memenuhi syarat untuk feed Saran, termasuk efek menakutkan, kejutan, riasan luka berdarah yang realistis, dan penggambaran fungsi tubuh. Sebagian besar konten kekerasan dan vulgar tidak diperbolehkan di TikTok. Namun, kami dapat mengizinkan jenis konten tertentu, seperti gambar grafis tentang kematian, kecelakaan, atau perkelahian jika konten tersebut berfungsi sebagai dokumentasi peristiwa nyata dan dianggap untuk kepentingan publik. Karena mungkin tidak semua penonton nyaman menontonnya, konten ini tidak akan memenuhi syarat untuk direkomendasikan, dan akan muncul layar atau peringatan \"memilih menerima\".","vid_mod_analytics_penalty_reason_fyf_title":"Tidak memenuhi syarat untuk feed Saran","vid_mod_analytics_penalty_reason_fyf_desc":"Video Anda tidak memenuhi standar kelayakan kami untuk feed Saran. Tinjau Panduan Komunitas TikTok untuk mendapatkan informasi selengkapnya \u003E Tidak memenuhi syarat untuk feed Saran","comment_turnoff_unlike":"Tidak dapat membatalkan suka karena pengaturan privasi pengguna","comment_turnoff_like":"Tidak dapat menyukai komentar karena pengaturan privasi pengguna","comment_nointernet_toast":"Ada masalah dengan internet, coba lagi nanti.","comment_delete_success":"Dihapus","comment_delete_failed":"Tidak dapat menghapus komentar. Coba lagi.","comment_reply_success":"Balasan terkirim","comment_post_success":"Komentar diposting","comment_banned_toast":"Karena beberapa pelanggaran atas Panduan Komunitas, Anda diblokir untuk sementara sehingga tidak dapat memberikan komentar. Lihat detailnya di notifikasi aplikasi.","comment_post_failed":"Tidak dapat memposting komentar. Coba lagi","Expand":"Perluas"}},"seo.abtest":{"canonical":"https:\u002F\u002Fwww.tiktok.com\u002Ftag\u002FICONNET","pageId":"668435945511511320","vidList":[],"parameters":{"add_info_card_seo":{"vid":"v2"},"add_transcript_seo":{"vid":"v2"},"bot_cost_optimize":{"simplify
